name: Release

on:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
  id-token: write
  pull-requests: write
  pages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: npm run version
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename version PR with new version number
        if: steps.changesets.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head "changeset-release/${GITHUB_REF_NAME}" \
            --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            VERSION=$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=changeset-release/${GITHUB_REF_NAME}" \
              --jq '.content' | base64 -d | jq -r '.version')
            gh pr edit "$PR_NUMBER" --title "chore: Release ${VERSION}"
          fi
      - name: Generate docs
        if: steps.changesets.outputs.published == 'true'
        run: npm run docs
      - name: Upload docs as artifact
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Publish docs to GitHub Pages
        if: steps.changesets.outputs.published == 'true'
        uses: actions/deploy-pages@v5
